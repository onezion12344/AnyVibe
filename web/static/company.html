<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coding Vibe · Company Dashboard</title>
<link rel="stylesheet" href="/static/call.css">
<style>
/* ── Company kanban (extends call.css tokens) ──────────────────────── */
#company-app {
  position: relative; z-index: 1; height: 100%;
  display: flex; flex-direction: column;
}

/* Header row */
.cmp-hd {
  padding: 14px 18px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.cmp-hd-title {
  font-size: 17px; font-weight: 700;
  background: linear-gradient(135deg, #f0c87a, var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.cmp-hd-badge {
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
  color: var(--muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px;
}

/* Controls bar */
.cmp-ctrl {
  padding: 0 18px 10px; display: flex; gap: 10px; align-items: center;
}
.cmp-btn {
  font-family: inherit; font-size: 12px; font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--white); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 16px; cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.cmp-btn:hover { border-color: var(--accent); }
.cmp-btn.accent { background: var(--accent); border-color: var(--accent); }
.cmp-btn.accent:hover { background: #c9584a; }

/* Status line */
.cmp-status {
  padding: 0 18px 4px; font-size: 11px; color: var(--muted);
  display: flex; gap: 16px; align-items: center;
}
.cmp-status .live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent3);
}
.cmp-status .live-dot.connected { background: #2ecc71; }

/* Kanban grid — 4 columns for Company mode */
.cmp-cols {
  flex: 1; padding: 8px 12px 12px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px; overflow: hidden;
}
.cmp-col {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 6px;
  display: flex; flex-direction: column; gap: 5px;
  overflow-y: auto;
}
.cmp-col-hd {
  font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.cmp-col-hd.n1 { color: var(--muted); }
.cmp-col-hd.n2 { color: var(--accent2); }
.cmp-col-hd.n3 { color: #e67e22; }
.cmp-col-hd.n4 { color: var(--accent3); }
.cmp-col-badge {
  background: var(--surface); border-radius: 8px;
  padding: 1px 6px; font-size: 10px;
}

/* Role card */
.role-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 8px;
  font-size: 11px;
  transition: border-color 0.2s, transform 0.2s;
  cursor: default;
}
.role-card:hover {
  border-color: var(--accent);
  transform: translateX(3px);
}
.role-card .rc-role {
  font-size: 12px; font-weight: 600; color: var(--accent2);
  margin-bottom: 2px;
}
.role-card .rc-role.ceo { color: var(--accent); }
.role-card .rc-subtitle {
  color: var(--white); line-height: 1.4; font-size: 10px;
}
.role-card .rc-edges {
  margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px;
}
.role-card .rc-edge {
  font-size: 8px; color: var(--accent3); background: rgba(58,138,138,0.15);
  border: 1px solid rgba(58,138,138,0.3);
  border-radius: 4px; padding: 1px 5px;
}
.role-card.done { opacity: 0.65; border-color: var(--accent3); }
.role-card.done .rc-role { color: var(--accent3); }

.cmp-col-empty {
  text-align: center; color: var(--muted); font-size: 11px; padding: 8px 0;
}

/* Toast / run notification */
.cmp-toast {
  position: fixed; top: 18px; right: 18px; z-index: 999;
  background: var(--surface); border: 1px solid var(--accent);
  border-radius: 10px; padding: 10px 16px;
  font-size: 12px; color: var(--white);
  box-shadow: 0 0 24px rgba(224,122,95,0.2);
  opacity: 0; transform: translateY(-8px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.cmp-toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div id="star-bg"></div>

<div id="company-app">
  <!-- Header -->
  <div class="cmp-hd">
    <div class="cmp-hd-title">Company Dashboard</div>
    <div class="cmp-hd-badge" id="cmp-hd-badge">Disconnected</div>
  </div>

  <!-- Controls -->
  <div class="cmp-ctrl">
    <button class="cmp-btn accent" id="btn-run" disabled>Run Demo</button>
    <button class="cmp-btn" id="btn-reset">Reset Board</button>
  </div>

  <!-- Status -->
  <div class="cmp-status">
    <div class="live-dot" id="cmp-dot"></div>
    <span id="cmp-status-text">Waiting for WebSocket...</span>
    <span id="cmp-card-count" style="margin-left:auto">0 cards</span>
  </div>

  <!-- Kanban: 4 columns -->
  <div class="cmp-cols">
    <div class="cmp-col" id="col-backlog">
      <div class="cmp-col-hd n1">Backlog <span class="cmp-col-badge">0</span></div>
      <div id="col-backlog-cards" class="cmp-col-empty">—</div>
    </div>
    <div class="cmp-col" id="col-running">
      <div class="cmp-col-hd n2">Running <span class="cmp-col-badge">0</span></div>
      <div id="col-running-cards" class="cmp-col-empty">—</div>
    </div>
    <div class="cmp-col" id="col-needs-approval">
      <div class="cmp-col-hd n3">Needs-Approval <span class="cmp-col-badge">0</span></div>
      <div id="col-needs_approval-cards" class="cmp-col-empty">—</div>
    </div>
    <div class="cmp-col" id="col-done">
      <div class="cmp-col-hd n4">Done <span class="cmp-col-badge">0</span></div>
      <div id="col-done-cards" class="cmp-col-empty">—</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="cmp-toast" id="cmp-toast"></div>

<script src="/static/company.js"></script>
</body>
</html>
