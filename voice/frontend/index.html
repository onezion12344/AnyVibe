<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Vibe — StepFun Realtime Voice</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d1b2a;--surface:#162236;--border:#1e3050;--accent:#e07a5f;--gold:#d4a843;--teal:#3a8a8a;--text:#f0e6d8;--muted:#8a9ab0}
    body{background:var(--bg);color:var(--text);font-family:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem}
    h1{font-size:1.4rem;background:linear-gradient(135deg,#f0c87a,#e07a5f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.04em}
    .card{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:2rem 2.2rem;width:100%;max-width:520px}
    .btn{padding:.75rem 1.4rem;border-radius:12px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .1s,background .15s}
    .btn:active{transform:scale(.97)}
    .btn-row{display:flex;gap:.7rem}
    .btn-connect{background:var(--accent);color:#fff;flex:1;box-shadow:0 0 30px rgba(224,122,95,.25)}
    .btn-connect:hover{background:#c9684f}
    .btn-connect:disabled{background:#4a3040;box-shadow:none;cursor:not-allowed}
    .btn-hangup{background:#c0392b;color:#fff;flex:1}
    .btn-hangup:hover{background:#a93226}
    .btn-hangup:disabled{background:#4a3040;cursor:not-allowed}
    .btn-mute{background:#2a3a4a;color:var(--muted);flex:0.5}
    .btn-mute:hover{background:#3a4a5a}
    .btn-mute.muted{background:#c0392b;color:#fff}
    .btn-mute:disabled{background:#1a1a2a;cursor:not-allowed}
    .status{margin-top:1rem;padding:.7rem 1rem;border-radius:8px;font-size:.85rem;line-height:1.4}
    .status.idle{background:#0a1628;border:1px solid var(--border);color:var(--muted)}
    .status.connecting,.status.connected{background:#12241c;border:1px solid var(--teal);color:#7ae0c0}
    .status.speaking{background:#1a2010;border:1px solid var(--gold);color:#f0c87a}
    .status.error{background:#2a1010;border:1px solid #e05050;color:#f08080}
    #log{margin-top:1rem;max-height:200px;overflow-y:auto;font-family:monospace;font-size:.72rem;color:var(--muted);line-height:1.6}
    #log span{display:block}
    #log .asr{color:#7ae0c0}
    #log .bot{color:#f0c87a}
    .transcript-bar{margin-top:.8rem;padding:.5rem .8rem;background:#0a1628;border:1px solid var(--border);border-radius:8px;font-size:.82rem;color:var(--text);min-height:2rem;word-break:break-word}
    .transcript-bar .label{font-size:.65rem;color:var(--muted);margin-right:.4rem;text-transform:uppercase}
    .mic-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem;background:var(--muted);transition:background .15s}
    .mic-indicator.active{background:#4caf50;box-shadow:0 0 6px #4caf50}
    .mic-indicator.speaking{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  </style>
</head>
<body>
  <h1>&#x1f411; Coding Vibe Voice — StepFun Realtime</h1>
  <div class="card">
    <div class="btn-row">
      <button id="callBtn" class="btn btn-connect">Call</button>
      <button id="muteBtn" class="btn btn-mute" disabled title="Toggle microphone mute">Mute</button>
      <button id="hangupBtn" class="btn btn-hangup" disabled>Hang up</button>
    </div>
    <div id="status" class="status idle"><span class="mic-indicator" id="micDot"></span>Ready — click Call to start the voice conversation.</div>
    <div class="transcript-bar" id="transcript">
      <span class="label">Bot:</span><span id="transcriptText"></span>
    </div>
    <div id="log"></div>
  </div>

<!--
  StepFun Realtime WebSocket voice frontend
  =========================================
  - Pure HTML/CSS/JS — zero npm packages needed
  - Web Audio API for mic capture (PCM16 24kHz mono) and playback
  - WebSocket relay to /ws (server forwards to StepFun Realtime API)
  - Yellow-sheep dark theme styling
-->

<script>
// ── Auth token injection ──────────────────────────────────────────────────────────
const CV_TOKEN = "__CV_OFFER_TOKEN__";
const _tokenReady = CV_TOKEN && !CV_TOKEN.includes("CV_OFFER_TOKEN");

// ── Config ────────────────────────────────────────────────────────────────────────
const SAMPLE_RATE = 24000;
const CHUNK_MS = 120;            // send audio every 120ms
const CHUNK_SAMPLES = Math.floor(SAMPLE_RATE * CHUNK_MS / 1000); // 2880 samples per chunk

const WS_URL = (() => {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const wsPath = "/ws";
  const tokenParam = _tokenReady ? `?token=${encodeURIComponent(CV_TOKEN)}` : "";
  return `${proto}//${location.host}${wsPath}${tokenParam}`;
})();

// ── DOM refs ─────────────────────────────────────────────────────────────────────
const callBtn   = document.getElementById("callBtn");
const muteBtn   = document.getElementById("muteBtn");
const hangupBtn = document.getElementById("hangupBtn");
const statusEl  = document.getElementById("status");
const logEl     = document.getElementById("log");
const transcriptTextEl = document.getElementById("transcriptText");

// ── Helpers ───────────────────────────────────────────────────────────────────────
function setStatus(cls, msg) {
  statusEl.className = `status ${cls}`;
  statusEl.textContent = msg;
}
function log(msg, cssClass = "") {
  const s = document.createElement("span");
  if (cssClass) s.className = cssClass;
  s.textContent = new Date().toISOString().slice(11, 19) + " " + msg;
  logEl.appendChild(s);
  logEl.scrollTop = logEl.scrollHeight;
}

// ── State ─────────────────────────────────────────────────────────────────────────
let ws            = null;
let audioCtx      = null;
let micStream     = null;
let scriptNode    = null;
let isCallActive  = false;
let isSpeaking    = false;
let isMuted       = false;
let botTranscript = "";
let audioBuffer   = [];   // Float32 buffer for accumulating mic samples

// ── Audio playback ───────────────────────────────────────────────────────────────

async function ensureAudioContext() {
  if (!audioCtx || audioCtx.state === "closed") {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: SAMPLE_RATE,
    });
  }
  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }
}

function playPCM16Base64(base64Data) {
  // Decode base64 → raw PCM16 bytes → Float32 → AudioBuffer → play
  if (!audioCtx) return;

  try {
    // Base64 → binary string → Uint8Array
    const binary = atob(base64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    // Uint8Array → Int16Array (little-endian PCM16)
    const numSamples = Math.floor(bytes.length / 2);
    const pcm = new Int16Array(numSamples);
    for (let i = 0; i < numSamples; i++) {
      pcm[i] = bytes[i * 2] | (bytes[i * 2 + 1] << 8);
    }

    // Convert to Float32 (-1.0 to 1.0)
    const floatData = new Float32Array(numSamples);
    for (let i = 0; i < numSamples; i++) {
      floatData[i] = pcm[i] / 32768;
    }

    // Create AudioBuffer and fill
    const buffer = audioCtx.createBuffer(1, numSamples, SAMPLE_RATE);
    buffer.getChannelData(0).set(floatData);

    // Play
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start();
  } catch (e) {
    log("Playback error: " + e.message);
  }
}

// ── PCM16 encoding ───────────────────────────────────────────────────────────────

function float32ToPCM16Base64(float32Array) {
  // Convert Float32Array (-1.0 to 1.0) → Int16Array → base64
  const len = float32Array.length;
  const int16 = new Int16Array(len);
  for (let i = 0; i < len; i++) {
    let s = Math.max(-1, Math.min(1, float32Array[i]));
    int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }

  // Int16Array → Uint8Array (little-endian)
  const bytes = new Uint8Array(len * 2);
  for (let i = 0; i < len; i++) {
    const val = int16[i];
    bytes[i * 2]     = val & 0xFF;
    bytes[i * 2 + 1] = (val >> 8) & 0xFF;
  }

  // Uint8Array → binary string → base64
  let binary = "";
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

// ── Microphone capture ───────────────────────────────────────────────────────────

async function startMic() {
  await ensureAudioContext();

  micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      sampleRate: SAMPLE_RATE,
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
    },
  });

  const source = audioCtx.createMediaStreamSource(micStream);

  // Use ScriptProcessorNode for PCM capture
  // Buffer size should be power of 2; 4096 works well for 24kHz (~170ms)
  const bufferSize = 4096;
  scriptNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);

  scriptNode.onaudioprocess = (event) => {
    if (!isCallActive || !ws) return;
    const inputData = event.inputBuffer.getChannelData(0);
    audioBuffer.push(...inputData);

    // When we have enough samples for a chunk, encode and send
    while (audioBuffer.length >= CHUNK_SAMPLES) {
      const chunk = new Float32Array(audioBuffer.splice(0, CHUNK_SAMPLES));
      const b64 = float32ToPCM16Base64(chunk);

      try {
        ws.send(JSON.stringify({
          type: "input_audio_buffer.append",
          audio: b64,
        }));
      } catch (e) {
        // silently drop — WebSocket errors are handled elsewhere
      }
    }
  };

  source.connect(scriptNode);
  scriptNode.connect(audioCtx.destination);

  log("Microphone started (24kHz mono PCM16)");
}

function stopMic() {
  if (scriptNode) {
    scriptNode.disconnect();
    scriptNode = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  audioBuffer = [];
}

// ── WebSocket handling ───────────────────────────────────────────────────────────

function connect() {
  setStatus("connecting", "Connecting to StepFun Realtime…");
  log("Connecting to " + WS_URL);

  ws = new WebSocket(WS_URL);

  ws.onopen = async () => {
    log("WebSocket connected");
    try {
      await startMic();
      isCallActive = true;
      callBtn.disabled = true;
      muteBtn.disabled = false;
      hangupBtn.disabled = false;
      setStatus("connected", "Connected — start speaking!");

      // Send session.update to configure the model
      ws.send(JSON.stringify({
        type: "session.update",
        session: {
          model: "step-1o-audio",
          modalities: ["text", "audio"],
          instructions: "你是 Yellow Sheep（黄羊），Coding Vibe 的客户成功伙伴（CS）。先自然回应用户，而不是急着转单或挂电话。问候、近况、进度、汇报、能力问题和闲聊都不是新任务：诚实聊天，不说‘已安排’、‘马上处理’或‘忙完回电’。只有用户明确要求一个可执行的软件交付或改动时，才简短复述后交给团队；交接后仍可继续通话和补充细节。模糊请求先问一个澄清问题；不要编造进展或主动结束通话。用中文回答。",
          voice: "alloy",
          input_audio_format: "pcm16",
          output_audio_format: "pcm16",
          input_audio_transcription: {
            model: "step-asr"
          },
          turn_detection: {
            type: "server_vad",
          },
        },
      }));
      log("Sent session.update");
    } catch (e) {
      log("Mic error: " + e.message);
      setStatus("error", e.message);
    }
  };

  ws.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }

    switch (msg.type) {
      case "session.updated":
        log("Session updated — model: " + (msg.session?.model || "?"));
        break;

      case "session.created":
        log("Session created (id: " + (msg.session?.id || "?") + ")");
        break;

      case "input_audio_buffer.speech_started":
        isSpeaking = true;
        document.getElementById("micDot").classList.add("active");
        log("Speech detected", "asr");
        break;

      case "input_audio_buffer.speech_stopped":
        isSpeaking = false;
        document.getElementById("micDot").classList.remove("active");
        log("Speech ended", "asr");
        // Auto-commit and create response on speech stop
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "input_audio_buffer.commit" }));
          ws.send(JSON.stringify({ type: "response.create" }));
        }
        break;

      case "input_audio_buffer.committed":
        log("Audio buffer committed");
        break;

      case "response.audio.delta":
        // Play audio chunk from the bot
        if (msg.delta) {
          playPCM16Base64(msg.delta);
        }
        break;

      case "response.audio_transcript.delta":
        // Show what the bot is saying
        botTranscript += (msg.delta || "");
        transcriptTextEl.textContent = botTranscript;
        break;

      case "response.text.delta":
        // Text output from the model
        if (!msg.delta) break;
        if (msg.delta !== botTranscript) {
          botTranscript += msg.delta;
        }
        transcriptTextEl.textContent = botTranscript;
        break;

      case "response.audio.done":
        log("Bot finished speaking", "bot");
        // Reset transcript for next turn
        botTranscript = "";
        transcriptTextEl.textContent = "";
        break;

      case "response.done":
        log("Response complete", "bot");
        break;

      case "error":
        log("Server error: " + (msg.error?.message || JSON.stringify(msg)), "error");
        break;

      default:
        // Log unknown events at reduced volume
        if (msg.type && !msg.type.startsWith("input_audio_buffer.")) {
          log("Event: " + msg.type);
        }
    }
  };

  ws.onerror = (e) => {
    log("WebSocket error");
    console.error("WS error:", e);
    setStatus("error", "WebSocket connection error");
  };

  ws.onclose = (e) => {
    log(`WebSocket closed (code=${e.code})`);
    cleanup();
  };
}

function hangup() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.close(1000, "user hangup");
  }
  cleanup();
}

function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) {
    muteBtn.textContent = "Unmute";
    muteBtn.classList.add("muted");
    // Mute the mic track
    if (micStream) {
      micStream.getAudioTracks().forEach(t => t.enabled = false);
    }
    log("Microphone muted");
  } else {
    muteBtn.textContent = "Mute";
    muteBtn.classList.remove("muted");
    if (micStream) {
      micStream.getAudioTracks().forEach(t => t.enabled = true);
    }
    log("Microphone unmuted");
  }
}

function cleanup() {
  isCallActive = false;
  isSpeaking = false;
  botTranscript = "";
  transcriptTextEl.textContent = "";
  stopMic();

  if (ws) {
    ws.onopen = null;
    ws.onmessage = null;
    ws.onerror = null;
    ws.onclose = null;
    ws = null;
  }

  callBtn.disabled = false;
  muteBtn.disabled = true;
  muteBtn.textContent = "Mute";
  muteBtn.classList.remove("muted");
  isMuted = false;
  hangupBtn.disabled = true;
  setStatus("idle", "Ready — click Call to start the voice conversation.");
}

// ── Button handlers ──────────────────────────────────────────────────────────────

callBtn.addEventListener("click", () => {
  if (isCallActive) return;
  connect();
});

hangupBtn.addEventListener("click", () => {
  if (isCallActive) hangup();
});

muteBtn.addEventListener("click", () => {
  if (isCallActive) toggleMute();
});

// ── Cleanup on page unload ───────────────────────────────────────────────────────
window.addEventListener("beforeunload", () => {
  cleanup();
});

// Ready
log("StepFun Realtime frontend loaded");
</script>
</body>
</html>
